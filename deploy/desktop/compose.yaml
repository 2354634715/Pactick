x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime: &runtime
  image: ${PACTICK_IMAGE:?Set PACTICK_IMAGE to the package release version}
  build:
    context: .
    dockerfile: Dockerfile.prebuilt
  platform: linux/amd64
  env_file:
    - ${PACTICK_CONFIG_DIR:?Set the absolute configuration directory}/api.env
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pactick}
      POSTGRES_USER: ${POSTGRES_USER:-pactick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the generated database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    logging: *logging

  api:
    <<: *runtime
    networks:
      - ingress
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PACTICK_BIND_ADDRESS:-127.0.0.1}:${PACTICK_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *runtime
    entrypoint: ["/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    profiles: ["maintenance"]

  admin:
    <<: *runtime
    entrypoint: ["/admin"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    profiles: ["maintenance"]

networks:
  ingress:
  backend:
    internal: true

volumes:
  postgres-data:
