services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pactick
      POSTGRES_USER: pactick
      POSTGRES_PASSWORD: pactick
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactick -d pactick"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://pactick:pactick@postgres:5432/pactick?sslmode=disable
      AUTH_JWT_SECRET: local-development-secret-change-before-deploy
      AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:

