name: pactick

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-runtime: &api-runtime
  image: ${PACTICK_IMAGE:?Set PACTICK_IMAGE to an immutable release tag}
  env_file:
    - ${PACTICK_CONFIG_DIR:-/opt/pactick/config}/api.env
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    env_file:
      - ${PACTICK_CONFIG_DIR:-/opt/pactick/config}/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    logging: *default-logging

  api:
    <<: *api-runtime
    build:
      context: .
      dockerfile: ${PACTICK_DOCKERFILE:-Dockerfile}
    networks:
      - ingress
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PACTICK_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *api-runtime
    build:
      context: .
      dockerfile: ${PACTICK_DOCKERFILE:-Dockerfile}
    entrypoint:
      - /migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    profiles:
      - maintenance

networks:
  ingress:
  backend:
    internal: true

volumes:
  postgres-data:
